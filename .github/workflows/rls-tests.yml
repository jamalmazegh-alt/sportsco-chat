name: RLS Security Tests

on:
  # Nightly: push pending migrations to bughunt then run the suite.
  schedule:
    - cron: "0 3 * * *" # 3 AM UTC — before E2E at 4 AM
  # Keep bughunt in sync whenever migrations land on main.
  # Also re-run when the RLS suite itself changes (test-only fixes used to
  # miss CI — see wall.documents seed / auth.uid() failure before #100).
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "tests/rls/**"
      - ".github/workflows/rls-tests.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Raison du lancement manuel (optionnel)"
        required: false
        default: "Test RLS à la demande"

permissions:
  contents: read
  issues: write

concurrency:
  group: rls-tests
  cancel-in-progress: false

jobs:
  rls-tests:
    name: RLS Security Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Log trigger reason
        run: |
          case "${{ github.event_name }}" in
            workflow_dispatch)
              echo "🖐️ Lancement manuel — ${{ inputs.reason }}"
              ;;
            schedule)
              echo "🌙 Lancement automatique (cron nocturne 03:00 UTC)"
              ;;
            push)
              echo "📦 Lancement auto — push migrations sur main (${{ github.sha }})"
              ;;
            *)
              echo "▶️ Trigger: ${{ github.event_name }}"
              ;;
          esac

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push pending migrations (anti-dérive bughunt)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: |
          set -euo pipefail
          bash scripts/ci-db-push.sh

      - name: Run RLS tests
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # Hard target guard — _global-setup.ts refuses to start unless the
          # ref extracted from SUPABASE_URL matches this value (bughunt).
          RLS_TARGET_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: bun run test:rls

      - name: Notify on failure (cron only)
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🚨 RLS Tests Failed — ${new Date().toISOString().slice(0,10)}`,
              body: `Les tests RLS ont échoué lors du run nocturne.\n\n**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nVérifier les régressions de sécurité avant le prochain déploiement.`,
              labels: ["security", "bug", "automated"]
            });
